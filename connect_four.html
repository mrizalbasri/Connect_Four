<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Four - AI Research Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4361ee;
            --primary-dark: #3f37c9;
            --secondary: #4895ef;
            --accent: #f72585;
            --bg-grad-1: #4cc9f0;
            --bg-grad-2: #4361ee;
            --surface: #ffffff;
            --text: #2b2d42;
            --text-light: #8d99ae;
            --board-blue: #023e8a;
            --red-piece: #ef233c;
            --yellow-piece: #ffbe0b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2));
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .main-wrapper {
            display: flex;
            gap: 30px;
            max-width: 1200px;
            width: 100%;
            align-items: flex-start;
        }

        .game-card {
            background: var(--surface);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            flex: 1;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .research-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 24px;
            width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            gap: 15px;
            height: 600px; /* Fixed height for scroll */
            border: 1px solid rgba(255,255,255,0.5);
            display: none; /* Hidden on menu */
        }

        @media (max-width: 1000px) {
            .main-wrapper { flex-direction: column; align-items: center; }
            .research-panel { width: 100%; height: auto; max-height: 500px; }
        }

        h1 {
            font-weight: 800;
            font-size: 2.5rem;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
            letter-spacing: -0.05em;
        }

        /* MENU STYLES */
        .mode-selection {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .mode-btn {
            background: white;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 20px 40px;
            font-size: 1.2rem;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            width: 100%;
            max-width: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .mode-btn:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(67, 97, 238, 0.3);
        }

        /* GAME STYLES */
        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 0 10px;
        }

        .status-badge {
            background: #f1f5f9;
            padding: 8px 16px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .player-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }

        .ai-selector select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            font-family: inherit;
            color: var(--text);
            cursor: pointer;
            outline: none;
        }

        .board {
            background: var(--board-blue);
            padding: 20px;
            border-radius: 20px;
            display: inline-block;
            box-shadow: inset 0 -8px 0 rgba(0,0,0,0.2), 0 20px 40px rgba(0,62,138,0.4);
            position: relative;
        }

        .row { display: flex; }
        
        .cell-wrapper {
            width: 70px;
            height: 70px;
            margin: 4px;
            cursor: pointer;
            position: relative;
        }
        
        /* The hole mask */
        .cell-mask {
            width: 100%;
            height: 100%;
            background: var(--board-blue);
            border-radius: 0%; /* Square mask with hole */
            /* Using radial gradient to create transparency hole */
            -webkit-mask: radial-gradient(circle at center, transparent 31px, black 32px);
            mask: radial-gradient(circle at center, transparent 31px, black 32px);
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            pointer-events: none;
        }
        
        /* Visual hole background (behind piece) */
        .cell-bg {
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.2);
        }

        .piece {
            width: 62px;
            height: 62px;
            border-radius: 50%;
            position: absolute;
            top: 4px;
            left: 4px;
            z-index: 5;
            transform: translateY(-500px); /* Start above */
            opacity: 0;
            transition: transform 0.5s cubic-bezier(0.5, 0, 0.5, 1);
        }

        .piece.dropped {
            transform: translateY(0);
            opacity: 1;
        }

        .piece.red {
            background: radial-gradient(circle at 30% 30%, #ff7b7b, var(--red-piece));
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .piece.yellow {
            background: radial-gradient(circle at 30% 30%, #ffe066, var(--yellow-piece));
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .piece.winning::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            animation: pulseWin 1s infinite;
        }

        @keyframes pulseWin {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }

        /* Interactive Columns */
        .column-hover-guide {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 78px; /* Slightly wider than cell */
            background: rgba(255, 255, 255, 0.1);
            z-index: 1;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            border-radius: 10px;
        }

        /* Log Panel */
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }

        .log-content {
            overflow-y: auto;
            flex: 1;
            padding-right: 5px;
            font-family: 'Consolas', monospace;
            font-size: 0.85rem;
        }

        .log-entry {
            background: #f8fafc;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 3px solid var(--primary);
        }
        
        .log-entry.high-score { border-left-color: var(--accent); background: #fff0f5; }

        .download-btn {
            background: var(--text);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .download-btn:hover { opacity: 0.9; }

        /* Overlay */
        .overlay {
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .overlay.active { opacity: 1; pointer-events: all; }

        .modal {
            background: white;
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s;
            max-width: 400px;
            width: 90%;
        }
        .overlay.active .modal { transform: scale(1); }

        .modal h2 { font-size: 3rem; margin-bottom: 10px; }
        .modal p { font-size: 1.5rem; font-weight: 800; margin-bottom: 30px; color: var(--text); }

        .control-btns { display: flex; gap: 10px; justify-content: center; }
        .control-btn {
            padding: 12px 24px;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: #e2e8f0; color: var(--text); }
        
        /* Mobile */
        @media (max-width: 600px) {
            .cell-wrapper { width: 45px; height: 45px; }
            .piece { width: 38px; height: 38px; }
            .cell-mask { -webkit-mask: radial-gradient(circle, transparent 19px, black 20px); mask: radial-gradient(circle, transparent 19px, black 20px); }
            h1 { font-size: 1.8rem; }
            .game-card { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <!-- GAME CARD -->
    <div class="game-card">
        <h1>Connect Four</h1>

        <!-- MODE SELECTION -->
        <div id="modeSelection" class="mode-selection">
            <button class="mode-btn" onclick="startGame('ai')">
                <i class="fa-solid fa-robot"></i> Lawan Komputer
            </button>
            <button class="mode-btn" onclick="startGame('player')">
                <i class="fa-solid fa-user-group"></i> Lawan Pemain
            </button>
            <button class="mode-btn" onclick="startGame('ai-vs-ai')">
                <i class="fa-solid fa-chess-knight"></i> Tonton AI vs AI
            </button>
        </div>

        <!-- GAME AREA -->
        <div id="gameArea" style="display: none;">
            <div class="header-controls">
                <div class="status-badge" id="turnIndicator">
                    Giliran: <span class="player-dot" style="background: var(--red-piece);"></span> <span id="turnText">Player 1</span>
                </div>
                
                <div class="ai-selector" id="aiSelector" style="display:none;">
                    <select onchange="updateAIStyle(this.value)">
                        <option value="attack">Mode Serang (Agresif)</option>
                        <option value="defend">Mode Bertahan (Pintar)</option>
                    </select>
                </div>

                <div class="control-btns">
                    <button class="control-btn btn-secondary" onclick="resetGame()" style="padding: 8px 16px;"><i class="fa-solid fa-rotate-right"></i> Reset</button>
                    <button class="control-btn btn-secondary" onclick="backToMenu()" style="padding: 8px 16px;"><i class="fa-solid fa-house"></i> Menu</button>
                </div>
            </div>

            <div class="board" id="board">
                <!-- Grid generated by JS -->
            </div>
        </div>
    </div>

    <!-- RESEARCH PANEL -->
    <div class="research-panel" id="researchPanel">
        <div class="log-header">
            <h3><i class="fa-solid fa-chart-line"></i> Data Analisis AI</h3>
            <div style="display:flex; gap:5px;">
                <button class="download-btn" onclick="clearLogs()" style="background:#ef233c;"><i class="fa-solid fa-trash"></i></button>
                <button class="download-btn" onclick="downloadLogs()"><i class="fa-solid fa-download"></i> JSON</button>
            </div>
        </div>
        <div class="log-content" id="logContent">
            <div style="text-align:center; color: #999; margin-top: 50px;">
                Log data keputusan AI<br>akan muncul di sini...
            </div>
        </div>
    </div>
</div>

<!-- WIN MODAL -->
<div class="overlay" id="winOverlay">
    <div class="modal">
    <div class="modal">
        <div id="winIcon" style="font-size: 3rem; margin-bottom: 10px; color: var(--primary);">
            <i class="fa-solid fa-trophy"></i>
        </div>
        <p id="winMessage">Player Wins!</p>
        <div class="control-btns">
            <button class="control-btn btn-primary" onclick="resetGame()"><i class="fa-solid fa-rotate-right"></i> Main Lagi</button>
            <button class="control-btn btn-secondary" onclick="downloadLogs()"><i class="fa-solid fa-download"></i> Data</button>
            <button class="control-btn btn-secondary" onclick="backToMenu()"><i class="fa-solid fa-house"></i> Menu</button>
        </div>
    </div>
</div>

<script src="js/ai_reflex.js"></script>
<script src="js/ai_defend.js"></script>
<script src="js/game.js"></script>

</body>
</html>

</body>
</html>
